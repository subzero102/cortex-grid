# --- Cortex Grid Consulting -------------------------------------------------
# vhost : cortexgridconsulting.com, www.cortexgridconsulting.com
# proxy : 127.0.0.1:3000 (cortex-grid container, plain HTTP)
# certs : lineages cortexgridconsulting.com (ECDSA) + cortexgridconsulting-rsa (RSA)
# context: /opt/vps-infra/nginx.conf, loaded by the vps-reverse-proxy container.

# --- HTTP :80 — ACME challenge + canonical redirect --------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name cortexgridconsulting.com www.cortexgridconsulting.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        try_files    $uri =404;
    }

    location / {
        return 301 https://cortexgridconsulting.com$request_uri;
    }
}

# --- HTTPS :443 --------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name cortexgridconsulting.com www.cortexgridconsulting.com;

    server_tokens off;

    # Dual certificate. nginx selects the certificate whose key type matches the
    # client's signature_algorithms extension, so ECDSA-incapable clients get the
    # RSA chain instead of "no shared cipher".
    ssl_certificate     /etc/letsencrypt/live/cortexgridconsulting-rsa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cortexgridconsulting-rsa/privkey.pem;
    ssl_certificate     /etc/letsencrypt/live/cortexgridconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cortexgridconsulting.com/privkey.pem;

    # TLS 1.0/1.1 stay disabled on purpose: deprecated by RFC 8996 and rejected by
    # security scanners. Clients that only speak them must be updated instead.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:CortexGrid:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling is intentionally absent: Let's Encrypt no longer publishes
    # OCSP responder URLs, so ssl_stapling only logs a warning.

    # HSTS is safe here: both names are covered by the certificate and HTTP is
    # permanently redirected above. Do not add "preload" unless you intend to
    # submit the domain to the browser preload lists.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Renewals must not depend on the redirect above.
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        try_files    $uri =404;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
