# Reject connections whose SNI matches no configured vhost.
#
# WHY: without an explicit default_server, nginx falls back to the first server
# block in the file. On this host that is extractjsonpath.com, so a client or
# proxy that connects without SNI is handed the wrong certificate and aborts the
# handshake.
#
# This file is a FRAGMENT for /opt/vps-infra/nginx.conf, not a drop-in conf.d
# file. It takes over the default_server role for the whole host on :80 and :443,
# so every other vhost must declare an explicit server_name. Verify first:
#
#   grep -nE '^\s*(server_name|listen)' /opt/vps-infra/nginx.conf
#
# Append it above the other server blocks, then:
#
#   docker compose exec reverse-proxy nginx -t
#   docker compose exec reverse-proxy nginx -s reload

server {
    listen      80  default_server;
    listen      [::]:80 default_server;
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;

    # No certificate is configured, so abort the TLS handshake instead of
    # presenting an unrelated site's certificate.
    ssl_reject_handshake on;

    return 444;
}
